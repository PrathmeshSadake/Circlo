spring.application.name=user-service
server.servlet.context-path=/users
server.port=9020

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:linkedin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:linkedin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

