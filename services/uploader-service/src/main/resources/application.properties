spring.application.name=uploader-service
server.port=9050
server.servlet.context-path=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

storage.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
storage.s3.public-url=${AWS_S3_PUBLIC_URL:http://localhost:9000}
storage.s3.region=${AWS_S3_REGION:us-east-1}
storage.s3.bucket=${AWS_S3_BUCKET:linkedin}
storage.s3.access-key=${AWS_S3_ACCESS_KEY:minio}
storage.s3.secret-key=${AWS_S3_SECRET_KEY:minio12345}
internal.token=${INTERNAL_TOKEN:local-dev-token}
