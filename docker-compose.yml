name: linkedin

x-eureka: &eureka
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-kafka: &kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-db: &db
  SPRING_DATASOURCE_USERNAME: linkedin
  SPRING_DATASOURCE_PASSWORD: linkedin

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkedin
      POSTGRES_PASSWORD: linkedin
      POSTGRES_DB: userdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/linkedin123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p linkedin123 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 25s

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: "65536"
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb -p local/linkedin || true &&
      mc anonymous set download local/linkedin
      "

  discovery-server:
    build: ./services/discovery-server
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  user-service:
    build: ./services/user-service
    environment:
      <<: [*eureka, *kafka, *db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  post-service:
    build: ./services/post-service
    environment:
      <<: [*eureka, *kafka, *db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postsdb
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  connection-service:
    build: ./services/connection-service
    environment:
      <<: [*eureka, *kafka]
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: linkedin123
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      <<: [*eureka, *kafka, *db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  uploader-service:
    build: ./services/uploader-service
    environment:
      <<: *eureka
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_URL: http://localhost:9000
      AWS_S3_BUCKET: linkedin
      AWS_S3_ACCESS_KEY: minio
      AWS_S3_SECRET_KEY: minio12345
      INTERNAL_TOKEN: local-dev-token
    depends_on:
      minio-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    environment:
      <<: *eureka
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_started
      post-service:
        condition: service_started
      connection-service:
        condition: service_started
      notification-service:
        condition: service_started
      uploader-service:
        condition: service_started

  web:
    build: ./apps/web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_PROXY_TARGET: http://api-gateway:8080
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
